function modalView(){if(!ui.modal)return '';let title='',body='',button='Save';const type=ui.modal;const p=data().projects.find(p=>p.id===ui.project)||data().projects[0];if(type==='project'){title='Create strategic initiative';body=`<div class="field-grid"><label class="field wide">Initiative name<input name="name" required maxlength="90" placeholder="e.g. Enterprise API Modernization"/></label><label class="field">Workstream<input name="stream" required placeholder="Architecture & Standards"/></label><label class="field">Business division<input name="division" required placeholder="Enterprise IT"/></label><label class="field">Discipline<select name="discipline"><option>Project Delivery</option><option>Architecture</option><option>QA & DevOps</option><option>Partner Management</option><option>AI Governance</option><option>Data Governance</option></select></label><label class="field">Budget in $1,000s<input name="budget" type="number" min="1" max="100000" value="250" required/></label><label class="field">Target date<input name="due" type="date" value="2027-06-30" required/></label><label class="field wide">Outcome / business case<textarea name="description" required placeholder="Describe the outcome this initiative must deliver."></textarea></label></div>`;}
if(type==='risk'){title='Register RAID item';body=`<div class="field-grid"><label class="field wide">Project${projectSelect(ui.project)}</label><label class="field">Category<select name="type"><option>Risk</option><option>Issue</option><option>Dependency</option></select></label><label class="field">Impact<select name="impact"><option>High</option><option>Medium</option><option>Low</option></select></label><label class="field wide">Title<input name="title" required maxlength="120" placeholder="Describe the potential impact"/></label><label class="field">Accountable role${roleSelect('ownerRole','pm')}</label><label class="field">Due date<input type="date" name="due" value="2026-12-18" required/></label><label class="field wide">Mitigation / response<textarea name="mitigation" required placeholder="Define the action and evidence needed"></textarea></label></div>`;}
if(type==='action'){title='Create follow-up action';body=`<div class="field-grid"><label class="field wide">Project${projectSelect(ui.project)}</label><label class="field wide">Action title<input name="title" required maxlength="120" placeholder="Specific, verifiable action"/></label><label class="field">Accountable role${roleSelect('ownerRole','pm')}</label><label class="field">Due date<input type="date" name="due" value="2026-12-18" required/></label><label class="field wide">Source<input name="source" required value="PM coordination"/></label></div>`;}
if(type==='meeting'){title='Record meeting outcome';body=`<div class="field-grid"><label class="field wide">Meeting title<input name="name" required maxlength="100" placeholder="e.g. Partner remediation checkpoint"/></label><label class="field wide">Related project${projectSelect(ui.project)}</label><label class="field wide">Decision and minutes<textarea name="notes" required placeholder="Record decision, evidence, attendees and consequences"></textarea></label><label class="field wide">Specific follow-up action<input name="actionTitle" required maxlength="120" placeholder="e.g. Partner to submit corrected contract"/></label><label class="field">Action owner${roleSelect('ownerRole','partner')}</label><label class="field">Due date<input name="due" type="date" value="2026-12-18" required/></label></div>`;}
if(type==='milestone'){title='Update milestone & delivery';body=`<p class="subtitle" style="margin-bottom:14px">${esc(p?.name)} · ${esc(p?.nextMilestone)}</p><div class="field-grid"><label class="field">Completion percentage<input name="progress" type="number" min="0" max="100" value="${p.progress}" required/></label><label class="field">Next milestone due<input name="milestoneDate" type="date" value="${p.milestoneDate}" required/></label><label class="field wide">Milestone evidence state<select name="milestoneDone"><option value="false" ${!p.milestoneDone?'selected':''}>Awaiting evidence</option><option value="true" ${p.milestoneDone?'selected':''}>Completed with evidence</option></select></label><label class="field wide">Delivery commentary<textarea name="note" required placeholder="What changed, why, who agreed, and what remains?"></textarea></label></div>`;}
return `<div class="modal-cover" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div><form id="demo-form" data-form="${type}">${body}<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${button}</button></div></form></div></div>`;}
function roleSelect(name,selected){return `<select name="${name}">${roles.map(([id,title])=>`<option value="${id}" ${id===selected?'selected':''}>${title}</option>`).join('')}</select>`;}
function helpContent(){const page=nav.find(x=>x.id===ui.page)?.name||'Project detail';const guide={
 overview:'This view connects investment, delivery exceptions, specialist actions and leadership decisions. Change roles to see who owns the next step.',
 roles:'Role selection simulates access and accountability. Only the named owner can sign off a control or formal decision; the PM coordinates the handoff.',
 governance:'Controls are evidence gates, not decoration. Architecture, QA, security and leadership approval must be recorded by responsible owners.',
 workflow:'Try Scenario Lab. Work through four approvals with role switching, then return to Strategic Portfolio or Project Execution to see shared status changes.',
 data:'Each industry has separate sample initiatives and saved browser-local state. Reset one industry without affecting the others.'};return `<div class="help-panel" role="dialog" aria-label="Page-aware demo guide"><div class="help-head"><div><b>◈ Mira · Demo guide</b><small>${esc(page)} · ${esc(roleLabel(store.role))}</small></div><button class="modal-close" data-action="close-help" aria-label="Close assistant">×</button></div><div class="help-body"><div class="help-answer">${guide[ui.helpTopic]||guide.overview}</div><div class="help-options">${[['overview','Explain this view'],['roles','Who can decide?'],['governance','What are the gates?'],['workflow','Show a real scenario'],['data','Is this live data?']].map(([id,label])=>`<button data-help-topic="${id}">${label}</button>`).join('')}</div><p class="footnote" style="margin-top:13px">Guided, rules-based help; no AI service or customer data connection.</p></div></div>`;}
function render(){const hasProject=!!ui.project&&ui.page==='project';let body=hasProject?renderProjectDetail():({command:renderCommand,portfolio:renderPortfolio,execution:renderExecution,raid:renderRAID,architecture:renderArchitecture,partners:renderPartners,devops:renderDevOps,ai:renderAI,steering:renderSteering,simulation:renderSimulation,guide:renderGuide}[ui.page]||renderCommand)();const sections=[...new Set(nav.map(n=>n.group))];root.innerHTML=`<div class="shell">${ui.mobile?'<div class="mobile-nav" data-action="close-menu"></div>':''}<aside class="sidebar ${ui.mobile?'open':''}"><div class="brand"><div class="mark">T</div><div class="brand-text"><strong>TechnPortfolio 360</strong><small>Delivery intelligence</small></div></div>${sections.map(group=>`<div class="side-section"><div class="side-section-name">${group}</div>${nav.filter(n=>n.group===group).map(n=>`<button class="nav-btn ${ui.page===n.id&&!hasProject?'active':''}" data-nav="${n.id}"><span class="nav-ico">${n.icon}</span>${n.name}</button>`).join('')}</div>`).join('')}<div class="side-footer"><div class="helper-pill"><b>◉ Independent simulation</b><p>Shared workflow logic. Industry-specific examples. No external data.</p><button data-nav="guide">How to use this demo →</button></div></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" data-action="toggle-menu" aria-label="Open navigation">☰</button><div class="crumb">TECHNOLOGY DELIVERY <span class="muted"> / </span> <b>${hasProject?'Initiative detail':nav.find(x=>x.id===ui.page)?.name||'Command Center'}</b></div><div class="top-controls"><label class="select-wrap" title="Change industry example data">◈ <select id="industry" aria-label="Industry">${Object.entries(industries).map(([id,x])=>`<option value="${id}" ${store.industry===id?'selected':''}>${x.name}</option>`).join('')}</select></label><label class="select-wrap" title="Switch simulation role">◎ <select id="role" aria-label="Role">${roles.map(([id,title])=>`<option value="${id}" ${store.role===id?'selected':''}>${title.replace('Senior IT Project Manager','Senior IT PM').replace('Security & AI Governance Lead','Security & AI Lead').replace('QA / DevOps Lead','QA / DevOps')}</option>`).join('')}</select></label><div class="avatar" title="${esc(rolePerson(store.role))}">${rolePerson(store.role).split(' ').map(x=>x[0]).join('')}</div></div></header><div class="content">${body}<div class="footnote" style="margin-top:25px;text-align:right">TechnPortfolio 360 · Independent front-end simulation · Illustrative data · Local browser persistence</div></div></main>${ui.help?helpContent():'<button class="floating-help" data-action="open-help" title="Ask Mira for context" aria-label="Open demo guide">✦</button>'}${modalView()}</div>`;}
function navigate(page){ui.page=page;ui.project=null;ui.mobile=false;ui.search='';ui.filter='All';window.scrollTo(0,0);render();}
function requireRole(who){if(store.role!==who){toast(`Switch to ${roleLabel(who)} to record this approval.`);return false;}return true;}
function recordControl(key,role,msg){if(!requireRole(role))return;if(data().controls[key])return;data().controls[key]=true;if(key==='qa'){data().automation.coverage=84;const risk=data().risks.find(r=>r.id==='RISK-02');if(risk)risk.status='Closed';}
if(key==='architecture'){const risk=data().risks.find(r=>r.id==='RISK-01');if(risk)risk.status='Closed';const v=data().vendors[0];if(v){v.escaped=Math.max(0,v.escaped-2);v.score=83;v.trend='Improving';}}
log(msg);save();render();toast('Evidence recorded. Connected portfolio records updated.');}
function handleAction(el){const action=el.dataset.action,id=el.dataset.id,value=el.dataset.value;const d=data();if(action==='toggle-menu'){ui.mobile=!ui.mobile;render();return;}if(action==='close-menu'){ui.mobile=false;render();return;}if(action==='open-help'){ui.help=true;ui.helpTopic='overview';render();return;}if(action==='close-help'){ui.help=false;render();return;}if(action==='close-modal'){ui.modal=null;render();return;}if(action.startsWith('modal-')){const m=action.replace('modal-','');ui.modal=m;render();return;}if(action==='go-portfolio'){navigate('portfolio');return;}if(action==='go-raid'){navigate('raid');return;}if(action==='go-simulation'){navigate('simulation');return;}if(action==='go-primary-project'){ui.project=d.projects[0].id;ui.page='project';ui.tab='governance';render();return;}if(action==='edit-project-milestone'){ui.project=id;ui.modal='milestone';render();return;}if(action==='switch-role-page'){store.role=el.dataset.role;save();ui.page=el.dataset.page;ui.project=null;ui.mobile=false;render();toast(`Now viewing as ${roleLabel(store.role)}.`);return;}
if(action==='approve-architecture'){recordControl('architecture','architect','Accepted partner architecture standard evidence and closed API deviation');return;}
if(action==='approve-qa'){recordControl('qa','quality','Accepted regression evidence; critical-path automated coverage updated to 84%');return;}
if(action==='approve-security'){recordControl('security','security','Recorded security sign-off for release readiness');return;}
if(action==='approve-ai'){recordControl('ai','security','Approved AI use-case governance control for limited pilot');return;}
if(action==='approve-fabric'){recordControl('fabric','security','Approved semantic deployment standard and Fabric governance checklist');return;}
if(action==='advance-pipeline'){if(!requireRole('quality'))return;d.automation.pipelines=Math.min(d.automation.totalPipelines,d.automation.pipelines+1);log('Onboarded another application team to shared CI/CD standard');save();render();toast('Pipeline adoption updated.');return;}
if(action==='decide'){const z=d.decisions.find(x=>x.id===id);if(!z)return;if(!requireRole(z.ownerRole))return;if(z.status!=='Pending')return;z.status=value;log(`${value} decision ${z.id}: ${z.title}`);save();render();toast(`Decision ${value.toLowerCase()} and recorded.`);return;}
if(action==='close-risk'){const z=d.risks.find(x=>x.id===id);if(!z)return;if(store.role!==z.ownerRole){toast(`Owned by ${roleLabel(z.ownerRole)}. Please switch roles.`);return;}z.status='Closed';log(`Resolved ${z.type.toLowerCase()} ${z.id}: ${z.title}`);save();render();toast('RAID item resolved.');return;}
if(action==='close-action'){const z=d.actions.find(x=>x.id===id);if(!z)return;if(store.role!==z.ownerRole){toast(`Assigned to ${roleLabel(z.ownerRole)}.`);return;}z.status='Done';log(`Completed action ${z.id}: ${z.title}`);save();render();toast('Action completed; audit trail updated.');return;}
if(action==='reset-industry'){if(!confirm(`Reset ${industries[store.industry].name} scenario to the original sample data?`))return;store.industryData[store.industry]=createIndustryData(store.industry);save();ui.project=null;render();toast('This industry demo has been reset.');return;}
if(action==='reset-all'){if(!confirm('Reset ALL industry scenarios and local changes?'))return;store=createInitialState();ui={page:'command',project:null,tab:'overview',filter:'All',search:'',modal:null,help:false,helpTopic:'overview',mobile:false};save();render();toast('All demo data reset.');return;}}
function handleForm(form){const v=Object.fromEntries(new FormData(form).entries()),d=data(),type=form.dataset.form;const text=x=>String(x||'').trim();if(type==='project'){const id=nextId(store.industry[0].toUpperCase()+'-NEW',d.projects);d.projects.push({id,name:text(v.name),stream:text(v.stream),division:text(v.division),discipline:v.discipline,description:text(v.description),status:'In review',phase:'Intake',progress:0,budget:Number(v.budget),spent:0,manager:'Jordan Lee',sponsor:'CTO',due:v.due,nextMilestone:'Discovery and estimation review',milestoneDate:v.due,milestoneDone:false,roleOwner:'pm'});log(`Created initiative ${id}: ${v.name}`);ui.project=id;ui.page='project';ui.tab='overview';toast('New initiative added to the portfolio.');}
if(type==='risk'){const id=nextId('RISK',d.risks);d.risks.push({id,projectId:v.projectId,type:v.type,impact:v.impact,title:text(v.title),mitigation:text(v.mitigation),ownerRole:v.ownerRole,owner:rolePerson(v.ownerRole),due:v.due,status:'Open'});log(`Registered ${v.type.toLowerCase()} ${id}: ${v.title}`);toast('RAID entry added.');}
if(type==='action'){const id=nextId('ACT',d.actions);d.actions.push({id,projectId:v.projectId,title:text(v.title),ownerRole:v.ownerRole,owner:rolePerson(v.ownerRole),due:v.due,status:'Open',source:text(v.source)});log(`Assigned action ${id}: ${v.title}`);toast('Follow-up action assigned.');}
if(type==='meeting'){if(store.role!=='pm'&&store.role!=='portfolio'){toast('Switch to Senior IT PM or Portfolio Director to record meeting outcomes.');return;}const id=nextId('MT',d.meetings||[]),actionId=nextId('ACT',d.actions);if(!d.meetings)d.meetings=[];d.meetings.push({id,projectId:v.projectId,name:text(v.name),notes:text(v.notes),ownerRole:v.ownerRole,owner:rolePerson(v.ownerRole),due:v.due});d.actions.push({id:actionId,projectId:v.projectId,title:text(v.actionTitle),ownerRole:v.ownerRole,owner:rolePerson(v.ownerRole),due:v.due,status:'Open',source:'Meeting '+id});log(`Meeting outcome ${id} recorded; follow-up ${actionId} assigned to ${rolePerson(v.ownerRole)}`);toast('Meeting outcome and follow-up saved.');}
if(type==='milestone'){const p=d.projects.find(p=>p.id===ui.project);if(p){if(store.role!=='pm'&&store.role!=='delivery'){toast('Switch to Senior IT PM or Delivery Team Lead to update milestones.');return;}p.progress=safePercent(v.progress);p.milestoneDate=v.milestoneDate;p.milestoneDone=v.milestoneDone==='true';log(`Milestone updated on ${p.id}: ${text(v.note)}`);toast('Milestone and evidence commentary saved.');}}
ui.modal=null;save();render();}
root.addEventListener('click',e=>{const node=e.target.closest('button,[data-dismiss]');if(!node)return;if(node.dataset.dismiss){if(e.target===node){ui.modal=null;render();}return;}if(node.dataset.nav){navigate(node.dataset.nav);return;}if(node.dataset.project){ui.project=node.dataset.project;ui.page='project';ui.tab='overview';ui.mobile=false;window.scrollTo(0,0);render();return;}if(node.dataset.tab){ui.tab=node.dataset.tab;render();return;}if(node.dataset.helpTopic){ui.helpTopic=node.dataset.helpTopic;render();return;}if(node.dataset.action)handleAction(node);});
root.addEventListener('change',e=>{if(e.target.id==='industry'){store.industry=e.target.value;if(!store.industryData[store.industry])store.industryData[store.industry]=createIndustryData(store.industry);save();navigate('command');toast(`${industries[store.industry].name} scenario loaded.`);}if(e.target.id==='role'){store.role=e.target.value;save();render();toast(`Role: ${roleLabel(store.role)}.`);}if(e.target.dataset.filterSelect){ui.filter=e.target.value;render();}});
root.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;ui.search=e.target.value;render();const n=document.getElementById('search');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
root.addEventListener('submit',e=>{if(e.target.id==='demo-form'){e.preventDefault();handleForm(e.target);}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.modal||ui.help||ui.mobile)){ui.modal=null;ui.help=false;ui.mobile=false;render();}});
render();
</script>
</body>
</html>
